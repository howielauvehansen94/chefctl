name: Crystal CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: crystal-lang/install-crystal@v1
    - name: Install dependencies
      run: shards install
    - name: Check formatting
      run: crystal tool format --check src spec
    - name: Run ameba
      run: crystal build lib/ameba/bin/ameba.cr -o bin/ameba && bin/ameba

  spec:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: crystal-lang/install-crystal@v1
    - name: Install dependencies
      run: shards install
    - name: Run tests
      run: crystal spec
